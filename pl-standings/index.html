<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premier League 2025/26 – Table and results</title>

<style>
:root{
  color-scheme: light;
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1A1433; --muted:#68657C; --line:#E2E2EA; --hover:#F0EEF7;
  --accent:#5B2A86;
  --z-champ:#D4A017; --z-ucl:#2F6FEB; --z-uel:#F08C00; --z-uecl:#12A39A; --z-rel:#D6336C;
  --win:#1E9E5A; --draw:#8C8A99; --loss:#D6336C;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --text:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --bg:#14111F; --surface:#1D1930; --ink:#ECEAF5; --muted:#A39FB8; --line:#2E2945; --hover:#262040;
    --accent:#B98AE6; --win:#3CC47C; --draw:#8F8BA6; --loss:#F06292; }
}
*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.5 var(--text);
  padding-bottom:env(safe-area-inset-bottom,0px); }
a{ color:inherit }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px }
main:focus, main:focus-visible{ outline:none }
.wrap{ max-width:940px; margin:0 auto; padding:0 16px }

header{ background:var(--ink); color:var(--bg); padding-top:env(safe-area-inset-top,0px) }
@media (prefers-color-scheme: dark){ header{ background:#0C0A14; color:var(--ink) } }
.head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; padding:22px 16px 0; flex-wrap:wrap }
.brand h1{ font:700 clamp(30px,6vw,46px)/0.95 var(--display); margin:0; letter-spacing:.2px }
.brand p{ margin:6px 0 16px; opacity:.72; font-size:15px }
nav{ display:flex; gap:4px }
nav a{ font:600 18px/1 var(--display); text-decoration:none; padding:12px 18px 14px; border-radius:8px 8px 0 0; opacity:.75 }
nav a[aria-current="page"]{ background:var(--bg); color:var(--ink); opacity:1 }
nav a:hover{ opacity:1 }

main.wrap{ padding:28px 16px 40px }
h2{ font:700 28px/1.1 var(--display); margin:0 0 4px }
.sub{ color:var(--muted); margin:0 0 18px; font-size:15px }

.card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden }
.scroll{ overflow-x:auto }
table{ border-collapse:collapse; width:100%; min-width:560px }
th{ font:600 14px/1 var(--display); color:var(--muted); text-align:center; padding:12px 6px; border-bottom:1px solid var(--line) }
td{ padding:0 6px; height:44px; text-align:center; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums }
tr:last-child td{ border-bottom:0 }
tbody tr:hover{ background:var(--hover) }
th.team, td.team{ text-align:left }
td.pos{ position:relative; width:52px; font:600 17px var(--display); padding-left:14px }
td.pos::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--zone,transparent) }
td.pts{ font:700 19px var(--display) }
.gd-pos{ color:var(--win) } .gd-neg{ color:var(--loss) }
.teamlink{ text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:10px; padding:10px 0 }
.teamlink:hover{ text-decoration:underline; text-underline-offset:3px }
.crest{ width:30px; height:22px; border-radius:4px; background:var(--hover); color:var(--muted);
  font:700 11px/22px var(--display); text-align:center; letter-spacing:.3px; flex:none }
td.small{ color:var(--muted); width:40px }

.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; margin:14px 2px 0; color:var(--muted); font-size:14px }
.legend span::before{ content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:7px; background:var(--c); vertical-align:-1px }

/* Results */
.rounds{ display:flex; gap:6px; overflow-x:auto; padding:2px 2px 12px; margin-bottom:6px; scrollbar-width:thin }
.rounds a{ flex:none; width:40px; height:40px; display:grid; place-items:center; border-radius:8px; text-decoration:none;
  font:600 17px var(--display); background:var(--surface); border:1px solid var(--line); color:var(--muted) }
.rounds a:hover{ color:var(--ink) }
.rounds a[aria-current="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink) }
.mwhead{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:10px 0 12px }
.mwhead h2{ margin:0 }
.step{ display:flex; gap:6px }
.step a{ text-decoration:none; font:600 16px var(--display); padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface) }
.step a[aria-disabled="true"]{ opacity:.35; pointer-events:none }

.fixture{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid var(--line) }
.fixture:last-child{ border-bottom:0 }
.fixture .home{ justify-self:end; text-align:right }
.fixture .home .teamlink{ flex-direction:row-reverse }
.score{ font:700 30px/1 var(--display); min-width:86px; text-align:center; letter-spacing:1px; font-variant-numeric:tabular-nums }
.score b{ font-weight:700 } .score .dim{ color:var(--muted); font-weight:600 }
.venue{ grid-column:1/-1; text-align:center; color:var(--muted); font-size:13px; margin-top:-6px }

/* Team page */
.back{ display:inline-block; margin-bottom:14px; text-decoration:none; color:var(--muted); font-weight:500 }
.back:hover{ color:var(--ink) }
.teamhead{ display:flex; align-items:center; gap:16px; margin-bottom:18px; flex-wrap:wrap }
.teamhead .crest{ width:64px; height:48px; font-size:22px; line-height:48px; border-radius:8px; background:var(--ink); color:var(--bg) }
.teamhead h2{ font-size:38px }
.facts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:10px; margin-bottom:20px }
.fact{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px }
.fact b{ display:block; font:700 28px/1 var(--display); white-space:nowrap }
.fact span{ color:var(--muted); font-size:14px }
.filters{ display:flex; gap:6px; margin-bottom:12px }
.filters button{ font:600 16px var(--display); padding:8px 16px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer }
.filters button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink) }
.res{ display:inline-grid; place-items:center; width:28px; height:28px; border-radius:6px; color:#fff; font:700 15px var(--display) }
.res.W{ background:var(--win) } .res.D{ background:var(--draw) } .res.L{ background:var(--loss) }
td.big{ font:700 22px var(--display); letter-spacing:.5px; white-space:nowrap }
.ha{ color:var(--muted); font-size:14px }
.form{ display:flex; gap:4px; flex-wrap:wrap }

footer{ color:var(--muted); font-size:13px; text-align:center; padding:0 16px 28px }
@media (max-width:560px){
  .fixture{ gap:8px; padding:10px 8px } .score{ font-size:24px; min-width:64px }
  .fixture .crest{ display:none }
  nav a{ padding:10px 14px 12px }
}
@media (prefers-reduced-motion:no-preference){ main{ animation:in .25s ease-out } @keyframes in{ from{opacity:.4} } }
</style>
</head>

,0,1],[29,"LEE","SUN",0,1],[29,"MCI","NFO",2,2],[29,"NEW","MUN",2,1],[29,"TOT","CRY",1,3],[29,"WOL","LIV",2,1],[30,"ARS","EVE",2,0],[30,"BRE","WOL",2,2],[30,"BUR","BOU",0,0],[30,"CHE","NEW",0,1],[30,"CRY","LEE",0,0],[30,"LIV","TOT",1,1],[30,"MUN","AVL",3,1],[30,"NFO","FUL",0,0],[30,"SUN","BHA",0,1],[30,"WHU","MCI",1,1],[31,"AVL","WHU",2,0],[31,"BHA","LIV",2,1],[31,"BOU","MUN",2,2],[31,"EVE","CHE",3,0],[31,"FUL","BUR",3,1],[31,"LEE","BRE",0,0],[31,"MCI","CRY",3,0],[31,"NEW","SUN",1,2],[31,"TOT","NFO",0,3],[31,"WOL","ARS",2,2],[32,"ARS","BOU",1,2],[32,"BRE","EVE",2,2],[32,"BUR","BHA",0,2],[32,"CHE","MCI",0,3],[32,"CRY","NEW",2,1],[32,"LIV","FUL",2,0],[32,"MUN","LEE",1,2],[32,"NFO","AVL",1,1],[32,"SUN","TOT",1,0],[32,"WHU","WOL",4,0],[33,"AVL","SUN",4,3],[33,"BRE","FUL",0,0],[33,"CHE","MUN",0,1],[33,"CRY","WHU",0,0],[33,"EVE","LIV",1,2],[33,"LEE","WOL",3,0],[33,"MCI","ARS",2,1],[33,"NEW","BOU",1,2],[33,"NFO","BUR",4,1],[33,"TOT","BHA",2,2],[34,"ARS","NEW",1,0],[34,"BHA","CHE",3,0],[34,"BOU","LEE",2,2],[34,"BUR","MCI",0,1],[34,"FUL","AVL",1,0],[34,"LIV","CRY",3,1],[34,"MUN","BRE",2,1],[34,"SUN","NFO",0,5],[34,"WHU","EVE",2,1],[34,"WOL","TOT",0,1],[35,"ARS","FUL",3,0],[35,"AVL","TOT",1,2],[35,"BOU","CRY",3,0],[35,"BRE","WHU",3,0],[35,"CHE","NFO",1,3],[35,"EVE","MCI",3,3],[35,"LEE","BUR",3,1],[35,"MUN","LIV",3,2],[35,"NEW","BHA",3,1],[35,"WOL","SUN",1,1],[36,"BHA","WOL",3,0],[36,"BUR","AVL",2,2],[36,"CRY","EVE",2,2],[36,"FUL","BOU",0,1],[36,"LIV","CHE",1,1],[36,"MCI","BRE",3,0],[36,"NFO","NEW",1,1],[36,"SUN","MUN",0,0],[36,"TOT","LEE",1,1],[36,"WHU","ARS",0,1],[37,"ARS","BUR",1,0],[37,"AVL","LIV",4,2],[37,"BOU","MCI",1,1],[37,"BRE","CRY",2,2],[37,"CHE","TOT",2,1],[37,"EVE","SUN",1,3],[37,"LEE","BHA",1,0],[37,"MUN","NFO",3,2],[37,"NEW","WHU",3,1],[37,"WOL","FUL",1,1],[38,"BHA","MUN",0,3],[38,"BUR","WOL",1,1],[38,"CRY","ARS",1,2],[38,"FUL","NEW",2,0],[38,"LIV","BRE",1,1],[38,"MCI","AVL",1,2],[38,"NFO","BOU",1,1],[38,"SUN","CHE",2,1],[38,"TOT","EVE",1,0],[38,"WHU","LEE",3,0]]};
const T = Object.fromEntries(DATA.teams.map(t => [t.c, t]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = s => { const [y,m,d] = s.split("-").map(Number); return `${d} ${MONTHS[m-1]} ${y}`; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const crest = c => `<span class="crest" aria-hidden="true">${c}</span>`;
const link = c => `<a class="teamlink" href="#team-${c}">${crest(c)}<span>${esc(T[c].s)}</span></a>`;

// ---- standings computed from results (same rules as the SQL view) ----
function standings(){
  const s = Object.fromEntries(DATA.teams.map(t => [t.c, {c:t.c,P:0,W:0,D:0,L:0,GF:0,GA:0}]));
  for (const [, h, a, hg, ag] of DATA.m){
    for (const [t, f, g] of [[h,hg,ag],[a,ag,hg]]){
      const r = s[t]; r.P++; r.GF += f; r.GA += g;
      if (f > g) r.W++; else if (f === g) r.D++; else r.L++;
    }
  }
  return Object.values(s).map(r => ({...r, GD:r.GF-r.GA, Pts:3*r.W + r.D}))
    .sort((x,y) => y.Pts-x.Pts || y.GD-x.GD || y.GF-x.GF || T[x.c].s.localeCompare(T[y.c].s))
    .map((r,i) => ({...r, pos:i+1}));
}
const TABLE = standings();
const POS = Object.fromEntries(TABLE.map(r => [r.c, r]));
const zone = p => p===1 ? "var(--z-champ)" : p<=5 ? "var(--z-ucl)" : p<=7 ? "var(--z-uel)" : p===8 ? "var(--z-uecl)" : p>=18 ? "var(--z-rel)" : "transparent";
const gd = n => `<span class="${n>0?'gd-pos':n<0?'gd-neg':''}">${n>0?'+':''}${n}</span>`;

function viewTable(){
  const rows = TABLE.map(r => `<tr>
    <td class="pos" style="--zone:${zone(r.pos)}">${r.pos}</td>
    <td class="team">${link(r.c)}</td>
    <td>${r.P}</td><td class="pts">${r.Pts}</td><td>${r.GF}</td><td>${r.GA}</td><td>${gd(r.GD)}</td>
    <td class="small">${r.W}</td><td class="small">${r.L}</td><td class="small">${r.D}</td></tr>`).join("");
  return `<h2>League table</h2><p class="sub">Final standings after 38 matchweeks. Select a club to see all its results.</p>
  <div class="card scroll"><table>
    <thead><tr><th>Pos</th><th class="team">Team</th><th title="Played">P</th><th title="Points">Pts</th>
    <th title="Goals for">GF</th><th title="Goals against">GA</th><th title="Goal difference">GD</th>
    <th title="Wins">W</th><th title="Losses">L</th><th title="Draws">D</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <div class="legend">
    <span style="--c:var(--z-champ)">Champions</span><span style="--c:var(--z-ucl)">Champions League</span>
    <span style="--c:var(--z-uel)">Europa League</span><span style="--c:var(--z-uecl)">Conference League</span>
    <span style="--c:var(--z-rel)">Relegated</span></div>`;
}

function viewResults(mw){
  const games = DATA.m.filter(m => m[0] === mw);
  const rounds = Array.from({length:38}, (_,i) => i+1).map(n =>
    `<a href="#results-${n}" aria-current="${n===mw}" aria-label="Matchweek ${n}">${n}</a>`).join("");
  const list = games.map(([, h, a, hg, ag]) => `<div class="fixture">
      <div class="home">${link(h)}</div>
      <div class="score" aria-label="${hg} to ${ag}">${hg > ag ? `<b>${hg}</b>` : `<span class="dim">${hg}</span>`}–${ag > hg ? `<b>${ag}</b>` : `<span class="dim">${ag}</span>`}</div>
      <div class="away">${link(a)}</div>
      <div class="venue">${esc(T[h].st)}</div></div>`).join("");
  return `<nav class="rounds" aria-label="Matchweeks">${rounds}</nav>
  <div class="mwhead"><div><h2>Matchweek ${mw}</h2><p class="sub" style="margin:0">${fmtDate(DATA.mw[mw])}</p></div>
    <div class="step"><a href="#results-${mw-1}" aria-disabled="${mw===1}">Previous</a><a href="#results-${mw+1}" aria-disabled="${mw===38}">Next</a></div></div>
  <div class="card">${list}</div>`;
}

let teamFilter = "All";
const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ({1:"st",2:"nd",3:"rd"}[n % 10] || "th"));
function viewTeam(c){
  const t = T[c], r = POS[c];
  const games = DATA.m.filter(m => m[1] === c || m[2] === c).map(([mw, h, a, hg, ag]) => {
    const home = h === c, gf = home ? hg : ag, ga = home ? ag : hg;
    return {mw, opp: home ? a : h, home, gf, ga, res: gf > ga ? "W" : gf === ga ? "D" : "L"};
  });
  const rec = side => { const g = games.filter(x => x.home === side);
    return `${g.filter(x=>x.res==="W").length}W ${g.filter(x=>x.res==="D").length}D ${g.filter(x=>x.res==="L").length}L`; };
  const shown = games.filter(g => teamFilter === "All" || (teamFilter === "Home") === g.home);
  const rows = shown.map(g => `<tr>
    <td class="small">${g.mw}</td><td class="ha" style="text-align:left">${fmtDate(DATA.mw[g.mw])}</td>
    <td class="ha">${g.home ? "Home" : "Away"}</td>
    <td class="team">${link(g.opp)}</td>
    <td class="big">${g.gf}–${g.ga}</td>
    <td><span class="res ${g.res}" aria-label="${{W:"Win",D:"Draw",L:"Loss"}[g.res]}">${g.res}</span></td></tr>`).join("");
  const last5 = games.slice(-5).map(g => `<span class="res ${g.res}">${g.res}</span>`).join("");
  const btn = f => `<button type="button" data-filter="${f}" aria-pressed="${teamFilter===f}">${f}</button>`;
  return `<a class="back" href="#table">← Back to the table</a>
  <div class="teamhead">${crest(c)}<div><h2>${esc(t.n)}</h2><p class="sub" style="margin:0">${esc(t.st)}</p></div></div>
  <div class="facts">
    <div class="fact"><b>${ordinal(r.pos)}</b><span>Final position</span></div>
    <div class="fact"><b>${r.Pts}</b><span>Points</span></div>
    <div class="fact"><b>${r.W}–${r.L}–${r.D}</b><span>Wins, losses, draws</span></div>
    <div class="fact"><b>${r.GF}:${r.GA}</b><span>Goals for and against</span></div>
    <div class="fact"><b style="font-size:20px;line-height:30px">${rec(true)}</b><span>At home</span></div>
    <div class="fact"><b style="font-size:20px;line-height:30px">${rec(false)}</b><span>Away</span></div>
  </div>
  <div class="mwhead"><h2 style="font-size:24px">All ${games.length} matches</h2><div class="form" aria-label="Last five results"><span class="ha" style="margin-right:4px;align-self:center">Last 5</span>${last5}</div></div>
  <div class="filters" role="group" aria-label="Show matches">${btn("All")}${btn("Home")}${btn("Away")}</div>
  <div class="card scroll"><table>
    <thead><tr><th>MW</th><th style="text-align:left">Date</th><th>Venue</th><th class="team">Opponent</th><th>Score</th><th>Result</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

// ---- routing: #table, #results-12, #team-ARS ----
const app = document.getElementById("app");
let lastHash = "";
function render(){
  const h = location.hash.slice(1) || "table";
  let html, section = "table", m;
  if ((m = h.match(/^team-([A-Z]{3})$/)) && T[m[1]]) { html = viewTeam(m[1]); }
  else if ((m = h.match(/^results(?:-(\d{1,2}))?$/))) {
    const n = Math.min(38, Math.max(1, Number(m[1] || 38))); html = viewResults(n); section = "results";
  } else { html = viewTable(); }
  app.innerHTML = html;
  for (const id of ["table","results"]) {
    const a = document.getElementById("nav-" + id);
    if (id === section && !h.startsWith("team-")) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  }
  const cur = app.querySelector('.rounds a[aria-current="true"]');
  if (cur) cur.scrollIntoView({block:"nearest", inline:"center"});
  const pageChanged = h !== lastHash && (h.split("-")[0] !== lastHash.split("-")[0] || h.startsWith("team-"));
  if (pageChanged && lastHash) { window.scrollTo(0,0); app.focus({preventScroll:true}); }
  lastHash = h;
  document.title = h.startsWith("team-") && T[h.slice(5)] ? `${T[h.slice(5)].n} – results 2025/26` : "Premier League 2025/26 – Table and results";
}
app.addEventListener("click", e => {
  const b = e.target.closest("button[data-filter]");
  if (b) { teamFilter = b.dataset.filter; render(); }
});
window.addEventListener("hashchange", () => { teamFilter = "All"; render(); });
render();
</script>
</body>
</html>
